name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum
      - name: Toolchain and dependency integrity
        run: |
          test "$(go env GOVERSION)" = "go1.26.5"
          go mod verify
          go mod tidy -diff
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor
          test -z "$(git ls-files --others --exclude-standard -- go.mod go.sum vendor)"
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit and race tests
        run: |
          go test ./...
          go test -race ./...
          GOOS=darwin GOARCH=amd64 go test -exec=true ./internal/secret
      - name: Daemon RPC fuzz smoke
        run: go test ./internal/daemon -run='^$' -fuzz='^FuzzDaemonRPCInputs$' -fuzztime=2s -parallel=1
      - name: Vet
        run: go vet ./...

  nix:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        max-jobs = 1
        cores = 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Flake evaluation and non-image Nix gates
        run: |
          nix flake check --no-build --print-build-logs
          nix build \
            .#checks.x86_64-linux.runtime-fuzz \
            .#checks.x86_64-linux.host-module-contract \
            .#checks.x86_64-linux.static-binaries \
            --no-link \
            --print-build-logs
      - name: Protobuf lint, breaking, and generated-code drift
        env:
          BUF_BREAKING_AGAINST: ${{ github.event_name == 'pull_request' && format('.git#ref={0}', github.event.pull_request.base.sha) || format('.git#ref={0}', github.event.before) }}
        run: |
          nix develop --command buf lint
          nix develop --command buf generate
          git diff --exit-code -- gen
          test -z "$(git ls-files --others --exclude-standard -- gen)"
          nix develop --command buf breaking --against "$BUF_BREAKING_AGAINST"
      - name: Static and vulnerability analysis
        run: |
          nix develop --command staticcheck ./...
          nix develop --command govulncheck ./...
          nix develop --command python3 tools/validate_schemas.py
          nix develop --command python3 tools/validate_examples.py
          nix develop --command python3 tools/check_packaging_assets.py
      - name: Secret scan
        run: nix develop --command gitleaks dir . --redact --no-banner --exit-code 1

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Validate workflow security policy
        run: nix build .#checks.x86_64-linux.workflow-policy --print-build-logs
      - name: Reject shell product logic
        run: |
          if find . -path './.git' -prune -o -path './vendor' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print | grep -q .; then
            echo "Shell product files are prohibited."
            exit 1
          fi
      - name: Reject credentials and torrent identifiers
        run: |
          if git grep -nEI '(PrivateKey[[:space:]]*=[[:space:]]*[A-Za-z0-9+/=]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|magnet:\?xt=urn:btih:)' -- . ':(exclude)vendor/**'; then
            echo "Potential credential or torrent identifier committed."
            exit 1
          fi
