{
  "version": 1,
  "suites": [
    {
      "id": "HOST",
      "tests": [
        {
          "id": "HOST-001",
          "name": "Strict preflight on supported encrypted host",
          "given": "supported host with KVM, systemd, cgroups v2, nftables, zram/no disk swap and hibernation disabled",
          "when": "private-vm doctor --strict",
          "then": "exit 0 and no blocking diagnostics"
        },
        {
          "id": "HOST-002",
          "name": "Missing KVM blocks",
          "given": "/dev/kvm absent or inaccessible",
          "when": "doctor or any run command",
          "then": "exit preflight code and create no session resources"
        },
        {
          "id": "HOST-003",
          "name": "Disk swap blocks strict run",
          "given": "unencrypted active disk swap",
          "when": "run",
          "then": "block before pulling or booting images"
        }
      ]
    },
    {
      "id": "SUPPLY",
      "tests": [
        {
          "id": "SUPPLY-001",
          "name": "Wrong image repository rejected",
          "given": "validly signed image from another repository",
          "when": "images verify",
          "then": "hard failure with no override"
        },
        {
          "id": "SUPPLY-002",
          "name": "Digest mismatch rejected before execution",
          "given": "modified compressed image",
          "when": "images pull/verify",
          "then": "delete partial artifact and never create root overlay"
        },
        {
          "id": "SUPPLY-003",
          "name": "Wrong role rejected",
          "given": "scanner image labeled as workstation request",
          "when": "plan",
          "then": "hard failure"
        },
        {
          "id": "SUPPLY-004",
          "name": "Mutable tag resolves before component download",
          "given": "a public OCI tag for a private-vm image",
          "when": "images pull resolves and downloads the artifact",
          "then": "the tag is resolved first, every component is fetched by its resolved SHA-256 descriptor, and the cache key is the immutable manifest digest"
        },
        {
          "id": "SUPPLY-005",
          "name": "Incomplete image pull is never runnable",
          "given": "cancellation, timeout, limit, digest, decode, stream-close or verifier failure during pull",
          "when": "the bounded pull terminates",
          "then": "no final digest directory exists and every hidden partial directory is removed"
        },
        {
          "id": "SUPPLY-006",
          "name": "Published manifest compatibility is exact",
          "given": "an otherwise intact artifact with a wrong role, bundle, architecture, guest API, QEMU policy, capability, source/lock/NixOS field, or compressed/installed cache binding",
          "when": "the strict image verifier evaluates the staged artifact",
          "then": "a stable redacted image verification error blocks provenance and publication"
        },
        {
          "id": "SUPPLY-007",
          "name": "Full-closure SPDX evidence is mandatory",
          "given": "a missing, malformed, ambiguous, duplicate, unsorted or incompletely bound SPDX 2.3 image-closure document",
          "when": "the official strict verifier evaluates the staged artifact",
          "then": "the artifact is rejected and cannot bypass the still-mandatory IMG-003 provenance verifier"
        },
        {
          "id": "SUPPLY-008",
          "name": "Official provenance identity is exact and immutable",
          "given": "a signed bundle with a wrong repository, workflow, branch/arbitrary tag, repository or owner numeric ID, source commit, SAN or OIDC issuer",
          "when": "the official image verifier evaluates the staged artifact",
          "then": "a stable redacted provenance identity failure blocks cache publication with no override"
        },
        {
          "id": "SUPPLY-009",
          "name": "Sigstore evidence is cryptographic and bounded",
          "given": "a missing, malformed, oversized, untrusted, expired or proof-less Sigstore DSSE bundle",
          "when": "the official image verifier evaluates the staged artifact",
          "then": "offline signature, certificate, SCT, Rekor and observer verification fails closed"
        },
        {
          "id": "SUPPLY-010",
          "name": "Verified cache provenance remains offline",
          "given": "a complete previously installed immutable digest entry",
          "when": "the official verifier rechecks it with network access trapped",
          "then": "the exact signed payload and cached component hashes verify without any network request"
        }
      ]
    },
    {
      "id": "RUNTIME",
      "tests": [
        {
          "id": "RUN-001",
          "name": "Single actor owns session transitions",
          "given": "concurrent valid and invalid lifecycle requests for one session",
          "when": "the daemon applies them",
          "then": "events have contiguous monotonic sequence numbers and cleanup-only states cannot be entered externally"
        },
        {
          "id": "RUN-002",
          "name": "Cleanup is coalesced and retryable",
          "given": "concurrent cleanup callers and one injected resource cleanup failure",
          "when": "cleanup is retried",
          "then": "one owner cleans in reverse order, records every attempt and resumes from the failed resource"
        },
        {
          "id": "RUN-003",
          "name": "Event stream is bounded",
          "given": "a valid replay cursor, a future cursor and a slow subscriber",
          "when": "clients follow session events",
          "then": "valid replay is gap-free and invalid or slow consumers receive stable fail-closed errors"
        },
        {
          "id": "RUN-004",
          "name": "Volatile store resists path substitution",
          "given": "symlinks, hardlinks, replaced roots, oversized records and malformed journals",
          "when": "the daemon opens or updates session state",
          "then": "dirfd-bound operations reject every untrusted object and never follow it"
        },
        {
          "id": "RUN-005",
          "name": "Typed QEMU model rejects forbidden transport",
          "given": "TCP display, TCP QMP, shared filesystem, arbitrary device or writable base requests",
          "when": "a launch specification is validated",
          "then": "launch fails with no child process or session resource"
        },
        {
          "id": "RUN-006",
          "name": "QEMU death and QMP loss converge",
          "given": "a running fake QEMU process",
          "when": "QMP disconnects, the process exits or cancellation occurs",
          "then": "bounded termination and the session cleanup owner remove all registered resources"
        },
        {
          "id": "RUN-007",
          "name": "Overlay base is trusted and immutable",
          "given": "untrusted ownership, writable mode, symlink substitution or a changed base image",
          "when": "an overlay is planned or created",
          "then": "creation is blocked and no overlay remains"
        },
        {
          "id": "RUN-008",
          "name": "Capacity planning is overflow safe",
          "given": "bounded memory, runtime and scratch probes including active disk swap",
          "when": "the storage backend is selected",
          "then": "the plan reserves required headroom, accepts only zram swap and blocks impossible capacity"
        },
        {
          "id": "RUN-009",
          "name": "LUKS scratch lifecycle is owned",
          "given": "an exact private scratch directory with the no-backup marker",
          "when": "allocation fails at each step or cleanup is repeated",
          "then": "loop, mapper, mount, ciphertext and volatile key resources converge to absent"
        }
      ]
    },
    {
      "id": "PUBLIC_IMAGE_CI",
      "tests": [
        {
          "id": "CI-IMG-001",
          "name": "One canonical image per fresh public runner",
          "given": "the active image-build matrix on a public repository",
          "when": "a canonical image input changes",
          "then": "six independent ubuntu-24.04 jobs each build exactly one reviewed image output with serialized Nix limits"
        },
        {
          "id": "CI-IMG-002",
          "name": "Role image boots without nested KVM",
          "given": "a canonical image built in its isolated matrix job",
          "when": "the assigned role smoke gate runs",
          "then": "the exact TCG check succeeds with requiredFeatures.kvm false and no self-hosted runner dependency"
        },
        {
          "id": "CI-IMG-003",
          "name": "Pull requests cannot publish image artifacts",
          "given": "untrusted pull-request source",
          "when": "the image workflow executes",
          "then": "only contents read is granted and no package, OIDC, attestation, release, cache or artifact-upload path exists"
        },
        {
          "id": "CI-IMG-004",
          "name": "Image job cleanup and failure evidence are bounded",
          "given": "a successful, failed or cancelled image build",
          "when": "the job reaches finalization",
          "then": "bounded capacity and target diagnostics are available and Nix outputs are garbage-collected without modifying the checkout"
        }
      ]
    },
    {
      "id": "IMAGE_RELEASE",
      "tests": [
        {
          "id": "REL-IMG-001",
          "name": "Official image publication is tag-only and isolated",
          "given": "the active release workflow source",
          "when": "workflow policy evaluates its trigger, matrix, runner, permissions and environment",
          "then": "only tag pushes can start six independent ubuntu-24.04 publication rows, bounded Go rejects any noncanonical v* ref or commit outside fetched official origin/main before Nix or publication, and each row is behind image-publish with exactly contents read, packages write, id-token write and attestations write"
        },
        {
          "id": "REL-IMG-002",
          "name": "Bounded producer derives one complete release candidate",
          "given": "one canonical Nix QCOW2 output and its exact runtime system closure",
          "when": "the Go preparation boundary runs",
          "then": "it selects one regular image, validates the QCOW2, deterministically compresses it with one worker, hashes it, emits the complete sorted-closure SPDX document, manifest, predicate and closed version-1 receipt, and removes staging on failure, cancellation or timeout"
        },
        {
          "id": "REL-IMG-003",
          "name": "Published OCI graph is exact",
          "given": "a valid prepared image and verified Sigstore bundle",
          "when": "the Go publisher constructs the OCI manifest",
          "then": "the config is exactly the two-byte empty object and the only ordered layers are image.qcow2.zst, manifest.json, sbom.spdx.json and provenance.json with their frozen media types and title annotations"
        },
        {
          "id": "REL-IMG-004",
          "name": "Attestation binds the compressed image before publication",
          "given": "the producer-computed image.qcow2.zst SHA-256 and the full-SHA-pinned attestation action bundle",
          "when": "publication is requested",
          "then": "the saved bundle names exactly image.qcow2.zst, binds that digest and passes NewOfficialVerifier under the official repository/workflow/ref/numeric-ID/invocation policy before any tag is created"
        },
        {
          "id": "REL-IMG-005",
          "name": "Publisher refuses existing tags and partial pushes do not tag",
          "given": "an existing release tag or an injected failure after any blob or manifest operation",
          "when": "the publisher attempts the release",
          "then": "an existing tag causes no blob writes, a failed partial push leaves no tag, and a successful conditional tag resolves to the exact prepared manifest digest"
        },
        {
          "id": "REL-IMG-006",
          "name": "Registry credential is transient and bounded",
          "given": "the protected job's short-lived GHCR credential",
          "when": "the Go publisher reads it from standard input",
          "then": "the credential is bounded, not cached, destroyed after use and absent from argv, environment, Docker state and redacted diagnostics"
        },
        {
          "id": "REL-IMG-007",
          "name": "Published images verify anonymously from clean runners",
          "given": "all six successfully published official image tags and public GHCR package visibility",
          "when": "six fresh read-only jobs with no registry credential resolve, pull and verify them",
          "then": "each tag resolves to its recorded digest and the exact four-layer manifest, complete SPDX closure and offline official Sigstore provenance pass; inaccessible visibility is a blocking reported failure rather than an authorization expansion"
        },
        {
          "id": "REL-IMG-008",
          "name": "Local completion does not pre-claim remote state",
          "given": "focused local release, schema and workflow-policy tests pass while a GitHub image run is pending or absent",
          "when": "implementation scheduling proceeds without waiting for remote CI",
          "then": "the local source gate is recorded separately and protected-environment enforcement, OIDC issuance, GHCR publication, public visibility and anonymous pull remain unverified blocking release gates until the remote run for the same source commit and protected Git tag succeeds"
        }
      ]
    },
    {
      "id": "EXPORTER",
      "tests": [
        {
          "id": "EXPORTER-001",
          "name": "Headless exporter image isolation",
          "given": "exporter image built from the locked NixOS definition with exporter-compiled guestd",
          "when": "the image configuration boots under TCG with no test VLAN, writable data disk or USB device",
          "then": "loopback is the only interface, no TCP/UDP listener or graphical/network-management stack exists, no quarantine or USB block device is attached, required LUKS2/ext4/partitioning/USB inspection tools and their image package inventory exist, and only common plus exporter capabilities are advertised"
        }
      ]
    },
    {
      "id": "DISPLAY",
      "tests": [
        {
          "id": "DISPLAY-001",
          "name": "Graphical workstation boot",
          "given": "verified workstation-basic image",
          "when": "desktop start",
          "then": "XFCE appears through SPICE Unix socket"
        },
        {
          "id": "DISPLAY-002",
          "name": "No display TCP listener",
          "given": "active desktop session",
          "when": "inspect host sockets and QEMU args",
          "then": "only session-owned Unix SPICE socket exists"
        },
        {
          "id": "DISPLAY-003",
          "name": "Clipboard and file transfer disabled",
          "given": "active SPICE session",
          "when": "copy or drag file in either direction",
          "then": "operation is unavailable"
        }
      ]
    },
    {
      "id": "VPN",
      "tests": [
        {
          "id": "VPN-001",
          "name": "Application traffic requires tunnel",
          "given": "online role with valid Proton profile",
          "when": "WireGuard is down",
          "then": "DNS, IPv4 and IPv6 application egress fail"
        },
        {
          "id": "VPN-002",
          "name": "Host endpoint allowlist",
          "given": "guest clear interface",
          "when": "the exact guest source targets the resolved Proton UDP tuple or any spoofed, non-Proton, DNS, public, LAN or metadata destination over IPv4 or IPv6",
          "then": "only the exact Proton tuple is forwarded/NATed and every other path is dropped before QEMU readiness"
        },
        {
          "id": "VPN-003",
          "name": "qBittorrent bound to proton0",
          "given": "downloader ready",
          "when": "inspect qBittorrent configuration and remove proton0",
          "then": "torrent traffic cannot continue"
        },
        {
          "id": "VPN-004",
          "name": "Profile grammar and volatile lifecycle",
          "given": "synthetic valid and adversarial Proton WireGuard profiles",
          "when": "import, inspect, rotate, remove and daemon-store close run",
          "then": "only the frozen one-peer/default-route grammar succeeds, status is redacted, replacements destroy prior generations and no profile can be restored"
        },
        {
          "id": "VPN-005",
          "name": "Stale endpoint requires rotation",
          "given": "a synthetic profile whose bounded trusted-host endpoint lookup fails or returns an unsafe result",
          "when": "the pre-launch endpoint check runs",
          "then": "VPN_ENDPOINT_UNRESOLVED blocks launch and redacted status requires a newly generated Proton profile"
        }
      ]
    },
    {
      "id": "EPHEMERAL",
      "tests": [
        {
          "id": "EPH-001",
          "name": "Normal teardown removes state",
          "given": "completed workstation session",
          "when": "desktop stop",
          "then": "QEMU, sockets, overlay, keys, mappings and namespaces disappear"
        },
        {
          "id": "EPH-002",
          "name": "Daemon crash recovery",
          "given": "active session",
          "when": "daemon is SIGKILLed and restarted",
          "then": "startup reconciliation terminates QEMU and destroys resources"
        },
        {
          "id": "EPH-003",
          "name": "Power-loss cryptographic erasure",
          "given": "large scratch backed by LUKS and volatile key",
          "when": "host reboots without cleanup",
          "then": "remaining ciphertext cannot be opened and startup deletes it"
        }
      ]
    },
    {
      "id": "TORRENT",
      "tests": [
        {
          "id": "TOR-001",
          "name": "Metadata before payload",
          "given": "valid magnet link",
          "when": "prepare torrent",
          "then": "file list/size appears while payload remains paused"
        },
        {
          "id": "TOR-002",
          "name": "Capacity failure is early",
          "given": "selected files exceed available scratch or output capacity",
          "when": "approve download",
          "then": "block before payload transfer"
        },
        {
          "id": "TOR-003",
          "name": "Downloader destroyed before scanning",
          "given": "completed download",
          "when": "scan phase starts",
          "then": "no downloader QEMU process exists"
        },
        {
          "id": "TOR-004",
          "name": "Secure input remains off argv and logs",
          "given": "synthetic magnet and metainfo fixtures",
          "when": "hidden-terminal, stdin and regular-file input paths run",
          "then": "input is bounded and cleared, malformed input rejects, and no private value enters argv, environment, status or errors"
        },
        {
          "id": "TOR-005",
          "name": "VPN loss pauses payload",
          "given": "an approved synthetic download in progress",
          "when": "the typed VPN-loss responder runs",
          "then": "qBittorrent is paused before the loss is reported and explicit re-verification is required"
        },
        {
          "id": "TOR-006",
          "name": "Seal cleanup is retryable",
          "given": "a verified completed synthetic download",
          "when": "the downloader absence audit fails once",
          "then": "scanner readiness remains false and a later retry audits destruction without downloading or resealing again"
        }
      ]
    },
    {
      "id": "SCAN",
      "tests": [
        {
          "id": "SCAN-001",
          "name": "Offline scan",
          "given": "quarantine attached to scanner",
          "when": "scan starts",
          "then": "QEMU has no NIC and host namespace has no network"
        },
        {
          "id": "SCAN-002",
          "name": "Read-only quarantine",
          "given": "scanner scan phase",
          "when": "guest attempts block/filesystem write",
          "then": "write fails"
        },
        {
          "id": "SCAN-003",
          "name": "Fail closed on skipped file",
          "given": "file exceeds scanner limit",
          "when": "scan completes",
          "then": "result rejected"
        },
        {
          "id": "SCAN-004",
          "name": "Archive bomb containment",
          "given": "crafted high-ratio archive",
          "when": "inventory/extraction runs",
          "then": "limits stop extraction before capacity exhaustion and reject"
        },
        {
          "id": "SCAN-005",
          "name": "Safe reconstruction provenance",
          "given": "supported document/media input",
          "when": "safe policy approves",
          "then": "output is reconstructed, rescanned, hashed and listed in report"
        },
        {
          "id": "SCAN-006",
          "name": "Scanner engine limits are representable and fail closed",
          "given": "a selection within cumulative quarantine capacity that contains an oversized file or expanded work",
          "when": "policy planning and each one-file ClamAV invocation are bounded",
          "then": "the cumulative capacity remains independent while every file and expanded operation is at most 4 GiB and every one-file ClamAV invocation is at most 300 seconds"
        },
        {
          "id": "SCAN-006-REPORT",
          "name": "Authenticated complete report",
          "given": "canonical scanner evidence and a volatile per-session MAC key",
          "when": "promotion verifies the report envelope",
          "then": "tampering, wrong key, incomplete phases, skipped output rescan and noncanonical JSON reject"
        }
      ]
    },
    {
      "id": "USB",
      "tests": [
        {
          "id": "USB-001",
          "name": "Composite USB rejected",
          "given": "device exposing storage and HID/network interface",
          "when": "usb enroll",
          "then": "hard failure"
        },
        {
          "id": "USB-002",
          "name": "Only exporter sees USB",
          "given": "full workflow",
          "when": "inspect QEMU device graphs",
          "then": "USB is attached only to exporter"
        },
        {
          "id": "USB-003",
          "name": "Three-way hash equality",
          "given": "approved output",
          "when": "export completes",
          "then": "scanner, host relay and exporter hashes match before success"
        }
      ]
    },
    {
      "id": "WORKSPACE",
      "tests": [
        {
          "id": "WS-001",
          "name": "Unexported work blocks stop",
          "given": "new file in ~/Export",
          "when": "desktop stop without discard",
          "then": "stop blocked"
        },
        {
          "id": "WS-002",
          "name": "Host import is explicit",
          "given": "single selected local file",
          "when": "workspace import",
          "then": "only that byte stream reaches ~/Inbox and guest cannot enumerate parent directory"
        },
        {
          "id": "WS-003",
          "name": "Safe promotion excludes original",
          "given": "torrent document sanitized",
          "when": "open in workstation",
          "then": "only report-listed reconstructed output is transferred"
        }
      ]
    }
  ]
}
