syntax = "proto3";

package privatevm.v1;

option go_package = "github.com/StevenBuglione/private-vm/gen/privatevm/v1;privatevmv1";

enum GuestRole {
  GUEST_ROLE_UNSPECIFIED = 0;
  GUEST_ROLE_WORKSTATION = 1;
  GUEST_ROLE_DOWNLOADER = 2;
  GUEST_ROLE_SCANNER = 3;
  GUEST_ROLE_EXPORTER = 4;
}

// TorrentDestination is selected before payload transfer so capacity can be
// proven for the complete workflow. It is semantic and cannot identify a host
// path, mount, device node, guest endpoint or QEMU argument.
enum TorrentDestination {
  TORRENT_DESTINATION_UNSPECIFIED = 0;
  TORRENT_DESTINATION_WORKSTATION = 1;
  TORRENT_DESTINATION_USB = 2;
}

// TorrentCapacityReceipt is daemon-owned, bounded evidence for the stages
// after quarantine download. The downloader independently measures the live
// quarantine filesystem; no path or device selector crosses this boundary.
message TorrentCapacityReceipt {
  uint32 schema_version = 1;
  TorrentDestination destination = 2;
  uint64 scan_available_bytes = 3;
  uint64 reconstruction_available_bytes = 4;
  uint64 destination_available_bytes = 5;
  uint64 root_overlay_budget_bytes = 6;
  uint64 archive_expansion_bytes = 7;
  uint64 reconstruction_bytes = 8;
  uint64 maximum_selected_bytes = 9;
  uint64 maximum_output_bytes = 10;
}

enum SessionPhase {
  SESSION_PHASE_UNSPECIFIED = 0;
  SESSION_PHASE_CREATED = 1;
  SESSION_PHASE_PREFLIGHTED = 2;
  SESSION_PHASE_IMAGES_VERIFIED = 3;
  SESSION_PHASE_STORAGE_READY = 4;
  SESSION_PHASE_ACTIVE = 5;
  SESSION_PHASE_STOPPING = 6;
  SESSION_PHASE_ABORTING = 7;
  SESSION_PHASE_DESTROYING = 8;
  SESSION_PHASE_DESTROYED = 9;
}

message ApiVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message RequestContext {
  ApiVersion api_version = 1;
  string request_id = 2;
  string session_id = 3;
}

message Empty {}

message Hash {
  string algorithm = 1;
  bytes value = 2;
}

message FileDescriptor {
  string logical_name = 1;
  uint64 size_bytes = 2;
  string detected_mime = 3;
  Hash digest = 4;
}

message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_INFO = 1;
    SEVERITY_WARNING = 2;
    SEVERITY_BLOCKING = 3;
  }
  string code = 1;
  Severity severity = 2;
  string summary = 3;
  string remediation = 4;
  bool overridable = 5;
}

message ErrorDetail {
  string code = 1;
  string safe_message = 2;
  string remediation = 3;
  bool retryable = 4;
  string session_state = 5;
  repeated FieldViolation field_violations = 6;
}

message FieldViolation {
  string field = 1;
  string description = 2;
}

message Progress {
  string operation = 1;
  uint64 completed = 2;
  uint64 total = 3;
  string unit = 4;
}

message TransferBegin {
  RequestContext context = 1;
  string transfer_id = 2;
  FileDescriptor descriptor = 3;
}

message TransferChunk {
  uint64 sequence = 1;
  bytes data = 2;
}

message TransferEnd {
  uint64 total_size = 1;
  Hash digest = 2;
}

message TransferFrame {
  oneof frame {
    TransferBegin begin = 1;
    TransferChunk chunk = 2;
    TransferEnd end = 3;
  }
}

message TransferReceipt {
  string transfer_id = 1;
  FileDescriptor descriptor = 2;
  Hash receiver_digest = 3;
}
