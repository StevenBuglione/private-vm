syntax = "proto3";

package privatevm.v1;

option go_package = "github.com/StevenBuglione/private-vm/gen/privatevm/v1;privatevmv1";

enum GuestRole {
  GUEST_ROLE_UNSPECIFIED = 0;
  GUEST_ROLE_WORKSTATION = 1;
  GUEST_ROLE_DOWNLOADER = 2;
  GUEST_ROLE_SCANNER = 3;
  GUEST_ROLE_EXPORTER = 4;
}

enum SessionPhase {
  SESSION_PHASE_UNSPECIFIED = 0;
  SESSION_PHASE_CREATED = 1;
  SESSION_PHASE_PREFLIGHTED = 2;
  SESSION_PHASE_IMAGES_VERIFIED = 3;
  SESSION_PHASE_BOOTING = 4;
  SESSION_PHASE_READY = 5;
  SESSION_PHASE_RUNNING = 6;
  SESSION_PHASE_STOPPING = 7;
  SESSION_PHASE_SUCCEEDED = 8;
  SESSION_PHASE_REJECTED = 9;
  SESSION_PHASE_ABORTING = 10;
  SESSION_PHASE_DESTROYED = 11;
  SESSION_PHASE_FAILED = 12;
}

message ApiVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message RequestContext {
  ApiVersion api_version = 1;
  string request_id = 2;
  string session_id = 3;
}

message Empty {}

message Hash {
  string algorithm = 1;
  bytes value = 2;
}

message FileDescriptor {
  string logical_name = 1;
  uint64 size_bytes = 2;
  string detected_mime = 3;
  Hash digest = 4;
}

message Diagnostic {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_INFO = 1;
    SEVERITY_WARNING = 2;
    SEVERITY_BLOCKING = 3;
  }
  string code = 1;
  Severity severity = 2;
  string summary = 3;
  string remediation = 4;
  bool overridable = 5;
}

message Progress {
  string operation = 1;
  uint64 completed = 2;
  uint64 total = 3;
  string unit = 4;
}
