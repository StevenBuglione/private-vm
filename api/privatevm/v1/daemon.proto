syntax = "proto3";

package privatevm.v1;

import "privatevm/v1/common.proto";
import "privatevm/v1/guest.proto";

option go_package = "github.com/StevenBuglione/private-vm/gen/privatevm/v1;privatevmv1";

service PrivateVMDaemonService {
  rpc GetVersion(Empty) returns (VersionResponse);
  rpc Doctor(DoctorRequest) returns (DoctorResponse);
  rpc PlanSession(PlanSessionRequest) returns (PlanSessionResponse);
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ImportVPNProfile(stream VPNProfileImportFrame) returns (VPNProfileStatus);
  rpc InspectVPNProfile(VPNProfileRequest) returns (VPNProfileStatus);
  rpc TestVPNProfile(VPNProfileRequest) returns (VPNProfileStatus);
  rpc RemoveVPNProfile(VPNProfileRequest) returns (VPNProfileStatus);
  rpc AddTorrent(stream HostTorrentInputFrame) returns (TorrentMetadata);
  rpc GetTorrentMetadata(TorrentControlRequest) returns (TorrentMetadata);
  rpc SelectTorrentFiles(HostSelectTorrentFilesRequest) returns (TorrentMetadata);
  rpc StartTorrentDownload(TorrentControlRequest) returns (stream TorrentEvent);
  rpc PauseTorrentDownload(TorrentControlRequest) returns (TorrentStatus);
  rpc GetTorrentStatus(TorrentControlRequest) returns (TorrentStatus);
  rpc SealTorrentQuarantine(TorrentControlRequest) returns (TorrentStatus);
  rpc StartScanner(HostScannerStartRequest) returns (stream HostScannerEvent);
  rpc GetScannerStatus(HostScannerControlRequest) returns (HostScannerStatus);
  rpc GetScannerReport(HostScannerControlRequest) returns (HostScannerReportSummary);
  rpc ApproveScanner(HostScannerApprovalRequest) returns (HostScannerStatus);
  rpc RejectScanner(HostScannerControlRequest) returns (HostScannerStatus);
  rpc StartRole(StartRoleRequest) returns (Session);
  rpc StopRole(StopRoleRequest) returns (Session);
  rpc AbortSession(AbortSessionRequest) returns (Session);
  rpc CleanupSession(CleanupSessionRequest) returns (Session);
  rpc StreamEvents(GetSessionRequest) returns (stream SessionEvent);
  rpc GetWorkspaceState(HostWorkspaceStateRequest) returns (WorkspaceState);
  rpc ImportWorkspaceFile(stream TransferFrame) returns (TransferReceipt);
  rpc ExportWorkspaceFile(ExportWorkspaceRequest) returns (stream TransferFrame);
  rpc VerifyWorkspaceExport(VerifyWorkspaceExportRequest) returns (WorkspaceState);
  rpc ExportWorkspaceToDestination(ExportWorkspaceToDestinationRequest) returns (WorkspaceState);
  rpc ClaimUSB(ClaimUSBRequest) returns (USBClaim);
  rpc ReleaseUSB(ReleaseUSBRequest) returns (Empty);
}

message VersionResponse {
  string version = 1;
  string commit = 2;
  ApiVersion api_version = 3;
}

message DoctorRequest {
  RequestContext context = 1;
  bool strict = 2;
}

message DoctorResponse {
  repeated Diagnostic diagnostics = 1;
  bool runnable = 2;
}

message ResourceRequest {
  uint32 vcpus = 1;
  uint64 memory_bytes = 2;
  uint64 root_bytes = 3;
  uint64 scratch_bytes = 4;
}

message PlanSessionRequest {
  RequestContext context = 1;
  GuestRole role = 2;
  string image_bundle = 3;
  ResourceRequest resources = 4;
  string policy_name = 5;
}

message PlanSessionResponse {
  repeated Diagnostic diagnostics = 1;
  ResourceRequest resolved_resources = 2;
  string image_digest = 3;
  bool runnable = 4;
}

message CreateSessionRequest {
  RequestContext context = 1;
  GuestRole role = 2;
  string image_bundle = 3;
  string policy_name = 4;
  ResourceRequest resources = 5;
}

message GetSessionRequest {
  RequestContext context = 1;
  uint64 after_sequence = 2;
}
message ListSessionsRequest {
  RequestContext context = 1;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
}

message VPNProfileImportBegin {
  RequestContext context = 1;
  string profile_name = 2;
}

message VPNProfileChunk { bytes data = 1; }

message VPNProfileImportFrame {
  oneof frame {
    VPNProfileImportBegin begin = 1;
    VPNProfileChunk chunk = 2;
  }
}

message VPNProfileRequest {
  RequestContext context = 1;
  string profile_name = 2;
}

message VPNProfileStatus {
  uint32 schema_version = 1;
  bool present = 2;
  uint64 generation = 3;
  string rotation = 4;
  string code = 5;
  string remediation = 6;
  bool ipv4_enabled = 7;
  bool ipv6_enabled = 8;
  uint32 interface_address_count = 9;
  uint32 dns_server_count = 10;
}

enum TorrentInputKind {
  TORRENT_INPUT_KIND_UNSPECIFIED = 0;
  TORRENT_INPUT_KIND_MAGNET = 1;
  TORRENT_INPUT_KIND_METAINFO = 2;
}

message HostTorrentInputBegin {
  RequestContext context = 1;
  TorrentInputKind kind = 2;
}

message HostTorrentChunk { bytes data = 1; }

message HostTorrentInputFrame {
  oneof frame {
    HostTorrentInputBegin begin = 1;
    HostTorrentChunk chunk = 2;
  }
}

message TorrentControlRequest { RequestContext context = 1; }

message HostSelectTorrentFilesRequest {
  RequestContext context = 1;
  repeated uint32 indexes = 2;
}

// Scanner host requests are semantic. The source session in StartScanner must
// be an owned downloader whose quarantine is sealed and whose QEMU process was
// audited absent. Later requests name the newly-created scanner session.
message HostScannerStartRequest {
  RequestContext context = 1;
  string policy_name = 2;
}

message HostScannerControlRequest { RequestContext context = 1; }

enum ScannerApprovalDestination {
  SCANNER_APPROVAL_DESTINATION_UNSPECIFIED = 0;
  SCANNER_APPROVAL_DESTINATION_WORKSTATION = 1;
  SCANNER_APPROVAL_DESTINATION_USB = 2;
}

message HostScannerApprovalRequest {
  RequestContext context = 1;
  ScannerApprovalDestination destination = 2;
}

// This is the complete CLI-safe scanner view. It deliberately omits report
// bodies, logical names, hashes, malware identifiers, paths and image/runtime
// details.
message HostScannerStatus {
  uint32 schema_version = 1;
  string scanner_session_id = 2;
  string workflow_state = 3;
  bool report_complete = 4;
  bool policy_approved = 5;
  bool policy_rejected = 6;
  uint32 sanitized_output_count = 7;
  uint64 sanitized_output_bytes = 8;
  uint32 finding_count = 9;
  uint32 blocking_finding_count = 10;
  string code = 11;
  string remediation = 12;
  // Set only by a successful workstation promotion. This opaque session ID
  // lets the unprivileged CLI connect the existing user-owned Unix viewer.
  string destination_session_id = 13;
}

message HostScannerReportSummary {
  uint32 schema_version = 1;
  string scanner_session_id = 2;
  bool complete = 3;
  string result = 4;
  uint32 input_count = 5;
  uint32 finding_count = 6;
  uint32 blocking_finding_count = 7;
  uint32 sanitized_output_count = 8;
  uint64 sanitized_output_bytes = 9;
  string code = 10;
  string remediation = 11;
}

message HostScannerEvent {
  HostScannerStatus status = 1;
  Progress progress = 2;
  Diagnostic finding = 3;
}

message StartRoleRequest { RequestContext context = 1; }

message StopRoleRequest {
  RequestContext context = 1;
  bool discard_unexported = 2;
  bool require_clean = 3;
}

message AbortSessionRequest {
  RequestContext context = 1;
  string reason_code = 2;
}

message CleanupSessionRequest {
  RequestContext context = 1;
}

message Session {
  string id = 1;
  uint32 owner_uid = 2;
  GuestRole role = 3;
  SessionPhase phase = 4;
  string workflow_state = 5;
  string image_digest = 6;
  repeated Diagnostic diagnostics = 7;
}

message SessionEvent {
  uint64 sequence = 1;
  string event_code = 2;
  Session session = 3;
  Progress progress = 4;
  Diagnostic diagnostic = 5;
  int64 unix_nanos = 6;
  string safe_message = 7;
}

message ExportWorkspaceRequest {
  RequestContext context = 1;
  string output_id = 2;
}

message HostWorkspaceStateRequest { RequestContext context = 1; }

message VerifyWorkspaceExportRequest {
  RequestContext context = 1;
  string output_id = 2;
  Hash daemon_digest = 3;
  Hash receiver_digest = 4;
}

// Workspace export destinations are semantic capabilities owned by the
// daemon. Requests never contain a host path, block device, mount point or
// arbitrary exporter argument.
enum WorkspaceExportDestination {
  WORKSPACE_EXPORT_DESTINATION_UNSPECIFIED = 0;
  WORKSPACE_EXPORT_DESTINATION_USB = 1;
  WORKSPACE_EXPORT_DESTINATION_ENCRYPTED_BUNDLE = 2;
}

message ExportWorkspaceToDestinationRequest {
  RequestContext context = 1;
  string output_id = 2;
  WorkspaceExportDestination destination = 3;
}

message ClaimUSBRequest {
  RequestContext context = 1;
  string enrollment_id = 2;
}

message USBClaim {
  string claim_id = 1;
  string enrollment_id = 2;
}

message ReleaseUSBRequest {
  RequestContext context = 1;
  string claim_id = 2;
}
