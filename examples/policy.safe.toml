version = 1
name = "safe"
mode = "safe"

[limits]
max_input_bytes = 536870912000
max_files = 100000
max_archive_depth = 3
max_expansion_ratio = 100.0
max_expanded_bytes = 1073741824000
scan_timeout_seconds = 14400

[rules]
reject_on_malware = true
reject_on_scan_error = true
reject_on_skipped_file = true
reject_encrypted_archives = true
block_executables = true
block_scripts = true
block_disk_images = true
sanitize_documents = true
reencode_media = true
strip_metadata = true
